name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste secrets (API keys, `.env`, tokens). For security problems use
        "Report a vulnerability" in the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Peep version
      description: Release tag, image tag or commit hash.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Built from source (make up)
        - Prebuilt GHCR images
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Firefox 130 on Android 15
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs app` or the browser console. Remove secrets.
      render: shell
