name: ensemble-chat

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ensemble_chat}
    volumes:
      # PG18 images keep data in a versioned subdir of /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  minio:
    # Chainguard build (upstream minio/minio images are no longer pullable), pinned by digest
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  app:
    # API + built SPA in one image; the only published port.
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      MODELS_CONFIG: ${MODELS_CONFIG:-/app/config/models.yaml}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8000"
    networks: [backend]
    restart: unless-stopped

  api-test:
    profiles: [test]
    build:
      context: .
      target: test
    env_file: .env
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ensemble_chat_test
      S3_BUCKET: ensemble-chat-test
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["pytest", "-q"]
    networks: [backend]

networks:
  backend:

volumes:
  postgres_data:
  minio_data:
