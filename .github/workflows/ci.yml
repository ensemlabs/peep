name: CI

on:
  push:
    branches: [main, dev, "dev-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `make test-be` runs `make env` first, which generates a throwaway .env with random secrets (nothing is
      # stored in the repo or in GitHub secrets). The tests generate their own Fernet key.
      - name: Run backend tests (Postgres + MinIO via compose)
        run: make test-be
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres minio
      - name: Stop the stack
        if: always()
        run: docker compose --profile test down -v

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run frontend tests and build
        run: make test-fe
