# Model registry used by the e2e stack (mounted into the app by docker-compose.e2e.yml). No secrets here.
# The live-model specs (@live-llm) use any OpenAI-compatible endpoint given by E2E_LLM_BASE_URL, E2E_LLM_API_KEY and
# E2E_LLM_MODEL (see docs/development.md). Without them the provider points at an unreachable host and those specs skip.
# The model switcher is on so tests can also pick replay:* models.
active: ${E2E_LLM_MODEL:-live-llm}
dev:
  model_switcher: true
providers:
  - id: live
    base_url: ${E2E_LLM_BASE_URL:-http://llm.invalid/v1}
    api_key_env: E2E_LLM_API_KEY
    usage: estimate
    models:
      - id: ${E2E_LLM_MODEL:-live-llm}
        label: Live model
        vision: true
        context_window: 1000000
        image_tokens: 258
        thinking:
          default: off
          returns_text: true
          read_from: {delta_fields: [reasoning_content, reasoning]}
          levels:
            - {id: off,  label: {en: Off,  vi: Tắt}, patch: {}}
            - {id: high, label: {en: High, vi: Cao}, patch: {reasoning_effort: high}}
