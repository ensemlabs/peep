# Model registry. Copy to config/models.yaml (git-ignored) and edit:   cp config/models.example.yaml config/models.yaml
#
# - `${ENV}` / `${ENV:-default}` are interpolated from the api container environment (.env).
# - Never put API keys in this file: `api_key_env` names the environment variable that holds the key.
# - Without config/models.yaml the api builds a registry from LLM_BASE_URL / LLM_API_KEY /
#   LLM_DEFAULT_MODEL / LLM_MODELS (OpenAI-compatible, thinking levels off/high).
# - Provider-specific request options live in each thinking level's `patch`:
#     * keys the OpenAI SDK knows (reasoning_effort, temperature, ...) are sent as normal parameters,
#     * `extra_body: {...}` (and any unknown key) is merged into the JSON request body.
# - Lines marked "verify against provider docs" come from research on 2026-11-23: provider APIs change,
#   check the current documentation before relying on them.

active: my-model            # the one model users get (placeholder: replace with an id defined below)

dev:
  model_switcher: false     # true: show a model picker and allow every model (+ replay:*). For dev/e2e only.

providers:
  # ------------------------------------------------------------------------------------------------
  # Generic OpenAI-compatible endpoint (placeholder - point it at your provider)
  # ------------------------------------------------------------------------------------------------
  - id: my-provider
    base_url: ${LLM_BASE_URL:-https://api.example.com/v1}
    api_key_env: LLM_API_KEY
    usage: provider         # provider: trust the usage returned by the API; estimate: always use tiktoken
    models:
      - id: my-model
        upstream: my-model-name      # name sent to the provider (defaults to id)
        label: My Model              # or {en: ..., vi: ...}
        vision: false
        context_window: 128000
        image_tokens: 765            # token estimate per attached image
        token_ratio: 1.0             # multiplier on tiktoken estimates (calibrate per model)
        # Omit `thinking` for models without reasoning controls.

