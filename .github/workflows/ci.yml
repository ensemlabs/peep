name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # `make test-be` runs `make env` first, which copies the example env file. The example values are enough
      # for the tests (they generate their own Fernet key), so no secret is needed.
      - name: Run backend tests (Postgres + MinIO via compose)
        run: make test-be
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres minio
      - name: Stop the stack
        if: always()
        run: docker compose --profile test down -v

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run frontend tests and build
        run: make test-fe
